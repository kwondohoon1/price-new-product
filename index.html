<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 파일은 이 페이지 밖으로 나가지 않는다: 외부 연결(connect/fetch/폼 전송)을 전부 막는다. 글꼴도 레포 안에서 읽는다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>가격세팅 신제품 추가</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <div class="title">가격세팅 <span class="mark">신제품 추가</span></div>
    <span class="credit">상품명 · 원가 → 네 시트에 같은 자리로</span>
    <span class="spacer"></span>
    <span class="privacy" title="서버로 보내지 않으며, 페이지가 외부와 통신하지 못하도록 막혀 있습니다"><span class="dot" aria-hidden="true"></span>파일은 이 브라우저 안에서만 처리</span>
  </div>
</header>

<main class="wrap">
  <section class="card" id="step-file">
    <h2><span class="num">1</span>가격세팅 파일 넣기</h2>
    <label class="drop" id="drop">
      <input type="file" id="picker" accept=".xlsx">
      <b>가격세팅 엑셀을 여기로 끌어 놓거나 눌러서 고르세요</b>
      <span>정산가세팅 · 마켓별상품코드 시트가 있는 파일 (예: 261012_가격세팅.xlsx)</span>
    </label>
    <p class="msg" id="file-msg" role="status"></p>
    <div id="file-info" hidden>
      <div class="stats" id="file-stats"></div>
      <div id="file-notes"></div>
      <details>
        <summary>지금 들어 있는 상품 보기</summary>
        <div class="table-wrap"><table class="grid" id="product-table"></table></div>
      </details>
    </div>
  </section>

  <section class="card" id="step-input" hidden>
    <h2><span class="num">2</span>신제품 <small class="sub">상품명·원가만 넣으면 나머지는 기존 행에서 이어받습니다</small></h2>
    <div id="items"></div>
    <div class="actions small"><button type="button" class="btn ghost" id="add-item">+ 상품 하나 더</button></div>
  </section>

  <section class="card" id="step-build" hidden>
    <h2><span class="num">3</span>내려받기</h2>
    <p class="namePreview">파일명 <b id="name-preview"></b></p>
    <div class="actions">
      <button type="button" class="btn primary" id="build">신제품 넣은 엑셀 만들기</button>
      <a class="btn lime" id="download" hidden>내려받기</a>
    </div>
    <div id="report"></div>
  </section>

  <footer class="foot">
    <span class="hint inline">넣는 곳: 마켓별상품코드 · 정산가세팅(표마다) · 최저가비교 · G마켓_프로모션 — 수식·서식·유효성 검사·필터 범위는 윗행에서 이어받습니다</span>
  </footer>
</main>

<template id="item-tpl">
  <div class="item">
    <div class="item-head">
      <b class="item-no"></b>
      <span class="spacer"></span>
      <button type="button" class="link item-del">빼기</button>
    </div>
    <div class="fields">
      <label class="f wide"><span>상품명 <i>필수</i></span><input type="text" data-k="name" autocomplete="off" placeholder="예: 에이서 NITRO 라데온 RX 9070 XT OC D6 16GB"></label>
      <label class="f"><span>원가 <i>필수</i></span><input type="text" data-k="cost" inputmode="numeric" autocomplete="off" placeholder="1,278,480"></label>
      <label class="f"><span>카테고리 <i>필수</i></span><input type="text" data-k="cat" list="cat-list" autocomplete="off"></label>
      <label class="f"><span>브랜드 <i>필수</i></span><input type="text" data-k="brand" list="brand-list" autocomplete="off"></label>
      <label class="f"><span>노출가 <em>선택</em></span><input type="text" data-k="price" inputmode="numeric" autocomplete="off" placeholder="비우면 입력가 빈칸"></label>
      <label class="f"><span>자사몰 코드 <em>선택</em></span><input type="text" data-k="code:자사몰" autocomplete="off"></label>
      <label class="f wide"><span>넣을 자리</span><select data-k="after"></select></label>
    </div>
    <details class="more">
      <summary>다른 마켓 코드 · 자사몰 노출가 따로</summary>
      <div class="fields more-fields"></div>
    </details>
    <div class="item-errors"></div>
    <div class="item-preview"></div>
  </div>
</template>

<datalist id="cat-list"></datalist>
<datalist id="brand-list"></datalist>

<script src="vendor/jszip.min.js"></script>
<script type="module" src="src/app.js?v=1"></script>
</body>
</html>
